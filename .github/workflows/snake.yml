name: generate animation

on:
  # Executa a cada 24 horas automaticamente
  schedule:
    - cron: "0 */24 * * *" 
  
  # Permite rodar manualmente na aba "Actions"
  workflow_dispatch:
  
  # Executa sempre que houver um push no branch principal
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 1. Baixa o repositório
      - name: checkout
        uses: actions/checkout@v3

      # 2. Gera os arquivos SVG da cobrinha
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 3. Envia os arquivos gerados para um branch chamado 'output'
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/gh-action-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
